services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AIOPS_ENVIRONMENT: development
      AIOPS_DATABASE_URL: sqlite:///./data/incident-agent.db
    ports:
      - "8000:8000"
    volumes:
      - incident-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  incident-data:
